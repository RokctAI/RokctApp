name: orders_sdk
description: "Order lifecycle domain states, cart calculations, and placement contracts."
version: 1.0.0
publish_to: 'none'
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=3.38.5"
dependencies:
  flutter:
    sdk: flutter
  core_sdk:
    path: ../core_sdk
  auth_sdk:
    path: ../auth_sdk
  processing_sdk:
    path: ../processing_sdk
  merchants_sdk:
    path: ../merchants_sdk
  wallet_sdk:
    path: ../wallet_sdk
  products_sdk:
    path: ../products_sdk
  users_sdk:
    path: ../users_sdk
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  freezed_annotation: ^3.1.0
  google_maps_flutter: ^2.12.3
  intl: ^0.20.2
  dio: ^5.9.0

dev_dependencies:
  build_runner: ^2.10.4
  freezed: ^3.2.3

dependency_overrides:
  freezed_annotation: 2.4.4
  http: ^1.2.0
