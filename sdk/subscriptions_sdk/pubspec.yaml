name: subscriptions_sdk
description: "Merchant and POS subscription plans, feature toggling matrices, payment link integration, and active state tracking."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=3.38.5"

dependencies:
  flutter:
    sdk: flutter
  core_sdk:
    path: ../core_sdk
  wallet_sdk:
    path: ../wallet_sdk
  payments_sdk:
    path: ../payments_sdk
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^3.1.0
  auto_route: ^11.1.0
  pull_to_refresh: ^2.0.0
  dio: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  freezed: ^2.4.7


dependency_overrides:
  http: ^1.2.0
